<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link href="/static/vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=2">
    <script src="/static/app.js?v=2" defer></script>
  </head>
  <body>
    <nav class="navbar app-navbar">
      <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <span class="brand-mark">D</span><span>Danish Node</span>
        </a>
        <div class="pipeline-status" id="pipelineBadge"></div>
      </div>
    </nav>
    <main class="container-xxl app-shell py-4 py-lg-5">
      <header class="workspace-heading mb-4">
        <div>
          <div class="eyebrow">LIVE RUN</div>
          <h1 id="pageTitle">{{ title }}</h1>
          <p id="pageDescription">{{ description }}</p>
        </div>
        <div class="heading-note"><span class="pulse-dot"></span><span id="activityLabel">Loading</span></div>
      </header>

      <section class="workspace-grid">
        <aside class="input-rail">
          <div class="rail-heading"><div><span class="section-kicker">INPUTS</span><h2>Run</h2></div></div>
          <form id="workflowForm">
              <div id="fields"></div>
              <div class="form-actions d-flex flex-wrap gap-2 align-items-center">
                <button class="btn btn-primary" id="submitBtn" type="submit"></button>
                <button class="btn btn-outline-secondary" id="resetBtn" type="button">Reset</button>
              </div>
          </form>
          <div class="alert alert-secondary mt-3 mb-0" id="status" role="status" aria-live="polite" aria-atomic="true">Loading workflow UI...</div>
        </aside>

          <section class="results-stage">
            <div class="results-header">
              <div><span class="section-kicker">OUTPUT</span><h2 id="outputTitle">Workflow output</h2></div>
              <div id="actions" class="d-flex flex-wrap gap-2" hidden></div>
            </div>
              <div id="timeline" class="list-group workflow-timeline mb-3"></div>
              <div id="output" class="vstack gap-3">
                <div class="empty-state"><strong>No result yet.</strong><span>Start a run to see the topology.</span></div>
              </div>
          </section>
      </section>
    </main>
  </body>
</html>
