syntax = "proto3";

package explainability_runner;

service ExplainabilityRunner {
  rpc Explain(AnalysisConfig) returns (ExplainResponse);
}

// Output of ConfigAssistant.ConfigureAnalysis; keep both definitions
// identical. config_json holds the run configuration as JSON text:
// analysis, model_type, model_path, and dataset_path (tabular) or
// background_data_path and test_data_path (LSTM), plus optional
// feature_names.
message AnalysisConfig {
  string status = 1;
  string message = 2;
  string config_json = 3;
}

message ExplainResponse {
  string summary_path = 1;
  repeated string artifacts = 2;
  string status = 3;
}
