syntax = "proto3";

package config_assistant;

service ConfigAssistant {
  rpc ConfigureAnalysis(ConfigureAnalysisRequest) returns (AnalysisConfig);
}

message ConfigureAnalysisRequest {
  string prompt = 1;
  string config_json = 2;
}

// Validated analysis configuration. Also the input of
// ExplainabilityRunner.Explain, so the two services can be linked;
// keep both definitions identical.
message AnalysisConfig {
  string status = 1;
  string message = 2;
  string config_json = 3;
}
