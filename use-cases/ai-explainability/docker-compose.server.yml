# Server overrides: use together with docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# Only the web UI is published. The workflow services stay internal: the
# orchestrator reaches them over the ai-effect-services network.
services:
  explainability-config-assistant:
    ports: !reset []
  explainability-runner:
    ports: !reset []
  web-ui:
    ports: !override
      - "${WEB_UI_PORT:-8082}:8080"
